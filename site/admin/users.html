<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIP NETWORK — User Management</title>
<style>
:root{--bg:#030b18;--card:#08172b;--line:#0b67b8;--text:#edf6ff;--muted:#8ea7c0;--blue:#169cff;--red:#ff5570;--green:#28dd8a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#0a2a52,#030b18 58%);color:var(--text);font-family:Arial,sans-serif}
header{padding:18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #0b3159;position:sticky;top:0;background:#06101de8;backdrop-filter:blur(10px)}
h1{margin:0;font-size:20px}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:linear-gradient(145deg,#0b1d34,#061222);border:1px solid #0b4f86;border-radius:16px;padding:16px;box-shadow:0 0 30px #006eff18}
.login{max-width:430px;margin:10vh auto}.hidden{display:none}input,button{font:inherit}input{width:100%;padding:13px;margin:7px 0 12px;border-radius:10px;border:1px solid #155889;background:#061525;color:#fff}
button{border:1px solid #167ac0;border-radius:10px;padding:11px 15px;background:linear-gradient(135deg,#0d9cff,#164ccf);color:white;font-weight:bold;cursor:pointer}
button.danger{background:linear-gradient(135deg,#ff5b74,#b50d38);border-color:#ff6380}button.gray{background:#0b2036}
.status{color:#ff9ead;min-height:22px}.top{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px}.count{color:#7ecbff}
.user{border:1px solid #0b3e68;border-radius:13px;padding:14px;margin:10px 0;background:#061526}.user h3{margin:0 0 8px}.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;color:var(--muted);font-size:13px}.devices{margin-top:12px;padding-top:10px;border-top:1px solid #0b3154}.device{padding:10px;background:#081c31;border-radius:9px;margin:7px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.device small{color:var(--muted)}.blocked{color:#ff6b82}.active{color:#41e59a}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.empty{color:var(--muted);padding:25px;text-align:center}
@media(max-width:650px){.meta{grid-template-columns:1fr}.device{align-items:flex-start;flex-direction:column}header h1{font-size:16px}.wrap{padding:10px}}
</style></head><body>
<header><h1>👑 VIP NETWORK — User Management</h1><button class="gray" onclick="logout()">Logout</button></header>
<main class="wrap">
<section id="loginBox" class="card login"><h2>Admin Login</h2><input id="pass" type="password" placeholder="Admin Password"><button onclick="login()">LOGIN</button><div id="status" class="status"></div></section>
<section id="panel" class="hidden"><div class="top"><b>User Accounts</b><span id="count" class="count"></span><button onclick="loadUsers()">↻ Refresh</button></div><div id="list" class="card"></div></section>
</main>
<script>
const API=location.origin;
const $=id=>document.getElementById(id);
async function api(path,opt={}){const h=new Headers(opt.headers||{});if(opt.body&&!h.has('Content-Type'))h.set('Content-Type','application/json');const r=await fetch(API+path,{...opt,headers:h,credentials:'include',cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function login(){try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('pass').value})});$('loginBox').classList.add('hidden');$('panel').classList.remove('hidden');loadUsers()}catch(e){$('status').textContent='Login failed: '+e.message}}
async function loadUsers(){const box=$('list');box.innerHTML='Loading...';try{const d=await api('/api/admin/users');const users=d.users||[];$('count').textContent=users.length+' users';box.innerHTML=users.length?users.map(u=>`<article class="user"><h3>👤 ${esc(u.username)}</h3><div class="meta"><div>🗓 Account: ${esc(u.createdAt||'—')}</div><div>🕒 Last login: ${esc(u.lastLoginAt||'—')}</div><div>💻 Last device: ${esc(u.lastDeviceName||'—')}</div><div>🆔 Device ID: ${esc(u.lastDeviceId||'—')}</div></div><div class="actions"><button onclick="resetPass('${esc(u.id)}')">🔑 Reset Password</button></div><div class="devices"><b>Devices (${u.devices.length})</b>${u.devices.length?u.devices.map(x=>`<div class="device"><div><b>${esc(x.name||'Unknown device')}</b><br><small>${esc(x.deviceId||'')}<br>${esc(x.lastSeen||'')}</small></div><div><span class="${x.blocked?'blocked':'active'}">${x.blocked?'Blocked':'Active'}</span><br><button class="${x.blocked?'gray':'danger'}" onclick="toggleDevice('${esc(x.deviceId)}',${x.blocked})">${x.blocked?'Unblock':'Block'}</button></div></div>`).join(''):'<p class="empty">No device</p>'}</div></article>`).join(''):'<p class="empty">No users yet.</p>'}catch(e){box.innerHTML='<p class="status">'+esc(e.message)+'</p>'}}
async function toggleDevice(id,blocked){if(!confirm((blocked?'Unblock':'Block')+' this device?'))return;try{await api('/api/admin/devices/'+(blocked?'unblock':'block'),{method:'POST',body:JSON.stringify({deviceId:id})});loadUsers()}catch(e){alert(e.message)}}
async function resetPass(id){const p=prompt('New password (minimum 4 characters):');if(!p)return;try{await api('/api/admin/users/reset-password',{method:'POST',body:JSON.stringify({userId:id,newPassword:p})});alert('Password changed successfully.')}catch(e){alert(e.message)}}
async function logout(){try{await api('/api/admin/logout',{method:'POST'})}catch(e){}location.reload()}
(async()=>{try{await api('/api/admin/session');$('loginBox').classList.add('hidden');$('panel').classList.remove('hidden');loadUsers()}catch(e){}})();
</script></body></html>
