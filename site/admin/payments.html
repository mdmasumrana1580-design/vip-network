<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payments — Admin Panel</title>
<style>body{margin:0;background:#080b12;color:#fff;font-family:Arial}.wrap{max-width:1000px;margin:auto;padding:20px}.card{background:#111827;border:1px solid #29364a;border-radius:16px;padding:16px;margin:12px 0}input,select{padding:10px;background:#0b1220;color:#fff;border:1px solid #34445b;border-radius:8px;margin:4px;width:calc(100% - 18px)}button{padding:9px 13px;border:0;border-radius:8px;margin:4px;cursor:pointer}.ok{background:#16a34a;color:#fff}.bad{background:#dc2626;color:#fff}.muted{color:#9ca9bb}.pay{border-top:1px solid #29364a;padding:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}</style></head><body><div class="wrap"><a href="index.html">← Admin Panel</a><h1>💳 Payments</h1>
<div class="card"><h2>Payment Settings</h2><div id="settings"></div><button class="ok" onclick="saveConfig()">Save Settings</button><div id="smsg"></div></div>
<div class="card"><h2>Pending / Recent Payments</h2><div id="list">Loading...</div></div></div><script>
let data=null;const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function load(){const r=await fetch('/api/admin/payments',{cache:'no-store'});if(!r.ok){location.href='index.html';return}data=await r.json();renderSettings();renderList()}
function renderSettings(){const c=data.config;const m=c.methods||{};$('settings').innerHTML=`<div class="grid">
<label>bKash<input id="bk" value="${esc(m.bkash?.number||'')}"></label><label>Nagad<input id="ng" value="${esc(m.nagad?.number||'')}"></label><label>Rocket<input id="ro" value="${esc(m.rocket?.number||'')}"></label>
</div><h3>Plans</h3>${c.plans.map((p,i)=>`<div class="grid"><input id="pn${i}" value="${esc(p.name)}"><input id="pa${i}" type="number" value="${p.amount}"><input id="pd${i}" type="number" value="${p.days}"></div>`).join('')}`}
async function saveConfig(){const c=data.config;const plans=c.plans.map((p,i)=>({id:p.id,name:$('pn'+i).value,amount:Number($('pa'+i).value),days:Number($('pd'+i).value)}));const body={paymentPlans:plans,paymentMethods:{bkash:{number:$('bk').value,enabled:true,label:'bKash'},nagad:{number:$('ng').value,enabled:true,label:'Nagad'},rocket:{number:$('ro').value,enabled:true,label:'Rocket'}}};const r=await fetch('/api/admin/payment-config',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(body)});$('smsg').textContent=r.ok?'Saved.':'Save failed';if(r.ok){data.config=(await r.json()).config;renderSettings()}}
function renderList(){$('list').innerHTML=(data.payments||[]).map(x=>`<div class="pay"><b>${esc(x.username)}</b> — ${esc(x.method)} — ৳${x.amount} — ${esc(x.planName)}<br>Sender: ${esc(x.senderNumber)}<br>Txn: <b>${esc(x.transactionId)}</b><br>Status: <b>${esc(x.status)}</b> ${x.status==='pending'?`<button class="ok" onclick="review('${x.id}','approve')">Approve</button><button class="bad" onclick="review('${x.id}','reject')">Reject</button>`:''}<button class="bad" onclick="deleteAccount('${x.id}')">Delete Account</button></div>`).join('')||'No payments.'}
async function review(id,action){if(action==='reject'&&!confirm('Reject this payment?'))return;const r=await fetch('/api/admin/payments',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({id,action})});if(r.ok)load();else alert('Could not update payment')}
async function deleteAccount(id){if(!confirm('এই payment-এর সাথে যুক্ত account, subscription ও payment history delete করবেন?\n\nDelete করার পর ওই device-এ আবার নতুন payment gateway দেখাবে.'))return;const r=await fetch('/api/admin/payments?id='+encodeURIComponent(id),{method:'DELETE'});const d=await r.json().catch(()=>({}));if(r.ok&&d.ok){alert('Account deleted. পরেরবার নতুন payment gateway দেখাবে।');load()}else alert(d.error||'Account delete করা যায়নি')}
load();setInterval(load,15000);
</script></body></html>
